# Record every publish into the `live` application to /var/cache/nginx/hls
# as <stream-key>-<timestamp>.flv. Mount /var/cache/nginx/hls to a host
# directory writable by uid 101 to persist recordings across restarts.

worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;
        chunk_size 4096;

        application live {
            live on;

            # HLS playback (same as base config)
            hls on;
            hls_path /var/cache/nginx/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;

            # Recording
            record all;
            record_path /var/cache/nginx/hls;
            record_unique on;
            record_suffix -%Y%m%d-%H%M%S.flv;
            # record_max_size 2048M;   # uncomment to cap file size
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        listen [::]:8080;

        location / {
            root /etc/nginx/dashboard;
            index index.html;
        }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/cache/nginx;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location = /stat.xsl {
            root /etc/nginx;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
