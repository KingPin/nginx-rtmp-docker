# Mirror a single ingest to multiple downstream RTMP services. Publishers
# push once to rtmp://<host>:1935/live/<key> and this server forwards a
# copy to each `push` target. Useful for "stream to YouTube + Twitch + a
# private mirror at the same time" setups.
#
# Replace the placeholder URLs and keys before using. Each push target
# acts as a separate publisher to the upstream service, so the stream key
# must match what that service issued you.

worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;
        chunk_size 4096;

        application live {
            live on;
            record off;

            hls on;
            hls_path /var/cache/nginx/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;

            # Each `push` is a separate downstream destination. Comment
            # out the ones you don't want. push_reconnect controls the
            # backoff if the upstream connection drops.
            push rtmp://a.rtmp.youtube.com/live2/YOUR-YOUTUBE-KEY;
            push rtmp://live.twitch.tv/app/YOUR-TWITCH-KEY;
            push rtmp://live-api-s.facebook.com:80/rtmp/YOUR-FB-KEY;

            push_reconnect 5s;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        listen [::]:8080;

        location / {
            root /etc/nginx/dashboard;
            index index.html;
        }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/cache/nginx;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location = /stat.xsl {
            root /etc/nginx;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
