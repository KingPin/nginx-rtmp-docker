# Lock down the operator surfaces (dashboard + /stat) to a private CIDR.
# /hls and /healthz stay open so playback and external health checks keep
# working. Tighten or widen the `allow` rules to match your network.
#
# Note: this is layer-7 source-IP filtering inside nginx; if you sit
# behind a reverse proxy or load balancer, also configure
# `set_real_ip_from` / `real_ip_header` or the allow-list will only ever
# see the proxy's IP.

worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;
        chunk_size 4096;

        application live {
            live on;
            record off;

            hls on;
            hls_path /var/cache/nginx/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    # If you're behind a trusted reverse proxy, uncomment these and
    # adjust the CIDR to the proxy's address(es) so allow/deny matches
    # the real client.
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    server {
        listen 8080;
        listen [::]:8080;

        # Dashboard — operator-only.
        location / {
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;

            root /etc/nginx/dashboard;
            index index.html;
        }

        # HLS playback — open (anyone with the URL can watch).
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/cache/nginx;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # Stat XML — operator-only (leaks stream keys + client info).
        location /stat {
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;

            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location = /stat.xsl {
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
            root /etc/nginx;
        }

        # Health probe — open, lets external checkers reach it.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
