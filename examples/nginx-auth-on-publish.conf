# Require an external HTTP service to OK every publisher before they can
# go live. nginx-rtmp issues a POST to `on_publish` with form fields
# (name, app, addr, flashver, ...) and treats:
#   - 2xx  → allowed
#   - 3xx Location → redirect the publish to that URL (e.g. another app)
#   - anything else → reject
#
# IMPORTANT: nginx-rtmp's on_publish callback only speaks plain HTTP, not
# HTTPS. Host the validator on the same machine (or on a private
# network), or terminate TLS in front of it with a sidecar — do not
# point this directly at a public HTTPS endpoint.
#
# Replace the auth URL with your validator. A typical validator looks up
# the `name` (stream key) in a database and returns 200 only if it's an
# active, paid, currently-authorized key.

worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;
        chunk_size 4096;

        application live {
            live on;
            record off;

            hls on;
            hls_path /var/cache/nginx/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;

            on_publish      http://auth.example.com/rtmp/publish;
            on_publish_done http://auth.example.com/rtmp/publish_done;

            # Optional: also gate playback (the `play` event fires for
            # RTMP pull clients, not for HLS over HTTP — gate HLS at the
            # http {} layer instead).
            # on_play http://auth.example.com/rtmp/play;
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        listen [::]:8080;

        location / {
            root /etc/nginx/dashboard;
            index index.html;
        }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/cache/nginx;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location = /stat.xsl {
            root /etc/nginx;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
